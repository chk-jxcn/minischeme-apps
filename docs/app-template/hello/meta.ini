[app]
id = hello
name = 示例应用
description = 模板：本地计数页（长按加一，网页清零）和应用代理的新闻页
version = 1
api = 1.8 ; the device API it needs: the framework's color schemes (theme-css) came in 1.8
pages = 2
page_ids = count, news ; English page names: <app>.<id> in a combined app (front: the first)

[fields]
; how the settings page shows each [config] key: type | label | help
; types: text, number:min-max, bool, select:value=label,value=label
; (no ASCII ; or # in these lines: they start a comment)
news_count = number:1-8 | 新闻条数 | 第二页显示几条
carousel = bool | 自动翻页 | 打开后按下面的时长依次显示各页
carousel_seconds = text | 每页秒数 | 一个值，或每页一个，如 15,10

[config]
news_count = 5
proxy_url = ; empty: config.ini [app] proxy (the app server)
carousel = ; empty: config.ini [app] carousel (1: turn the pages by themselves, 0: manual)
carousel_seconds = ; empty: config.ini [app] carousel_seconds (seconds per page, or one per page)
