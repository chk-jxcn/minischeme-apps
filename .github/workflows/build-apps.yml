name: Build and Release Applications

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout minischeme-apps
      uses: actions/checkout@v4

    - name: Checkout minischeme compiler core
      uses: actions/checkout@v4
      with:
        repository: chk-jxcn/minischeme
        path: tools/minischeme

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pillow

    - name: Validate App Metadata
      run: |
        python -c "
        import glob, configparser, sys
        errs = 0
        for f in glob.glob('apps/*/meta.ini'):
            cfg = configparser.ConfigParser()
            cfg.read(f, encoding='utf-8')
            if 'app' not in cfg or 'id' not in cfg['app']:
                print(f'Error in {f}: missing [app] id', file=sys.stderr)
                errs += 1
            if 'config' not in cfg or 'proxy_url' not in cfg['config']:
                print(f'Warning in {f}: missing proxy_url', file=sys.stderr)
        if errs:
            sys.exit(1)
        print('All app metadata verified successfully.')
        "

    - name: Build MSBC Bytecode Binaries
      run: |
        python tools/build_apps.py

    - name: Archive MSBC Binaries
      run: |
        cd dist
        zip -r minischeme-apps-binaries.zip *.msbc index.json
        cd ..

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: minischeme-msbc-binaries
        path: dist/

    - name: Publish Release Assets
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        files: |
          dist/*.msbc
          dist/index.json
          dist/minischeme-apps-binaries.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
