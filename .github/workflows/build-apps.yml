name: Build and Release Applications

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout minischeme-apps
      uses: actions/checkout@v4

    - name: Checkout minischeme compiler core
      uses: actions/checkout@v4
      with:
        repository: chk-jxcn/minischeme
        path: tools/minischeme

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pillow

    - name: Validate App Metadata
      run: |
        python -c "
        import glob, configparser, sys
        errs = 0
        for f in glob.glob('apps/*/meta.ini'):
            cfg = configparser.ConfigParser()
            cfg.read(f, encoding='utf-8')
            if 'app' not in cfg or 'id' not in cfg['app']:
                print(f'Error in {f}: missing [app] id', file=sys.stderr)
                errs += 1
        if errs:
            sys.exit(1)
        print('All app metadata verified successfully.')
        "

    - name: Build MSBC Bytecode Binaries
      run: |
        python tools/build_apps.py

    - name: Commit Precompiled Artifacts to Repository
      if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add apps/ index.json dist/
        if ! git diff --staged --quiet; then
          git commit -m "chore(build): update precompiled msbc and allinone scm artifacts [skip ci]"
          git push
        fi

    - name: Package Source and Binary Archives Separately
      run: |
        cd dist
        rm -f *.zip
        zip -r minischeme-apps-source.zip *.allinone.scm index.json
        zip -r minischeme-apps-binaries.zip *.msbc index.json
        cd ..

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: minischeme-msbc-binaries
        path: dist/

    - name: Publish Release Assets (Source & Binaries Separated)
      if: startsWith(github.ref, 'refs/tags/v')   # releases only from a pushed version tag
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: "MiniScheme Apps Release (${{ github.ref_name }})"
        make_latest: true
        files: |
          dist/minischeme-apps-source.zip
          dist/minischeme-apps-binaries.zip
          dist/*.msbc
          dist/*.allinone.scm
          dist/index.json
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
