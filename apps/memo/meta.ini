[app]
pages = 2
page_ids = todo, done ; English page names: <app>.<id> in a combined app (front: the first)
page_names = 待办, 已完成 ; the pages' own names, as page_ids (the settings page shows them)
id = memo
name = 备忘录
description = 待办和已完成的备忘，在设备网页的应用选项卡中添加、编辑、置顶；不需要代理
version = 12
api = 1.17 ; the device API it needs: 1.17 runs the instructions the build emits (loop jumps, local operands, superinstructions, self calls ...; --target-api 1.16 or older for older firmware)
applib = 1.1 ; the app library version it needs (apps/lib/, MAJOR.MINOR: the same MAJOR, an equal or higher MINOR)

[fields]
; how the settings page shows each [config] key: type | label | help
; types: text, number:min-max, bool, select:value=label,value=label
; (no ASCII ; or # in these lines: they start a comment)
carousel = bool | 自动翻页 | 在待办和已完成之间自动切换
carousel_seconds = text | 每页秒数 | 一个值，或每页一个，如 20,10
show_pages = pages | 显示的页面 | 选择要显示的页面和顺序，同一页可以出现多次。留空显示全部页面。直接填写时用英文页名或页码（第一页为 1），逗号分开

[config]
carousel = ; empty: config.ini [app] carousel (1: turn the pages by themselves, 0: manual)
carousel_seconds = ; empty: config.ini [app] carousel_seconds (seconds per page, or one per page)
proxy_url = ; Application proxy service URL (empty: use system config.ini)
converter_url = ; Protocol converter URL (empty: use system config.ini)
show_pages = ; the pages to show in this order, comma separated page_ids (a page may come several times, numbers and page names work too); empty: every page
