[app]
pages = 1
page_ids = now ; English page names: <app>.<id> in a combined app (front: the first)
page_names = 温湿度 ; the pages' own names, as page_ids (the settings page shows them)
id = thermo
name = 蓝牙温湿度
description = 用蓝牙读取米家温湿度计（LYWSD03MMC）的温度、湿度和电量，带温度曲线；版面随屏幕宽度变化（172 到 320 像素）；需要带蓝牙的固件，不需要联网
version = 1
applib = 1.1 ; the app library version it needs (apps/lib/, MAJOR.MINOR: the same MAJOR, an equal or higher MINOR)

[fields]
; how the settings page shows each [config] key: type | label | help
; types: text, number:min-max, bool, select:value=label,value=label
; (no ASCII ; or # in these lines: they start a comment)
address = text | 温湿度计地址 | 如 a4:c1:38:4c:87:a2，留空则自动搜索信号最强的一台
interval = number:0-120 | 读取间隔（分钟） | 每隔这么久连接一次读数后断开，省温湿度计的电；0 为一直连着（约 6 秒一个读数）

[config]
address = ; the thermometer's Bluetooth address; empty: the strongest LYWSD03MMC found by a scan
interval = 5 ; minutes between readings (the link is closed in between); 0: stay connected
