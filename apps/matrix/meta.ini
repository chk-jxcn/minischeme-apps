[app]
pages = 8
page_ids = clock, rainbow, rain, life, fire, drawing, text, ball ; English page names: <app>.<id> in a combined app (front: the first)
page_names = 时钟, 彩虹, 数字雨, 生命游戏, 火焰, 画板, 跑马灯, 小球 ; the pages' own names, as page_ids (the settings page shows them)
id = matrix
name = 矩阵灯
description = 8×8 彩色 LED 矩阵上的八种模式：滚动时钟、彩虹、数字雨、生命游戏、火焰、画板、跑马灯文字、随倾斜滚动的小球；在设备网页的应用选项卡里选模式、设颜色、用鼠标画画、输入跑马灯文字；需要带 LED 矩阵的板子（ESP32-S3-Matrix）；不需要联网
version = 2
optional_extensions = imu ; used when the board has it (api-has?): the ball rolls with the tilt
applib = 1.1 ; the app library version it needs (apps/lib/, MAJOR.MINOR: the same MAJOR, an equal or higher MINOR)

[fields]
; how the settings page shows each [config] key: type | label | help
; types: text, number:min-max, bool, select:value=label,value=label
; (no ASCII ; or # in these lines: they start a comment)
brightness = number:1-100 | 亮度 | LED 的亮度百分比，100 是固件允许的上限（防止发热）
mode = select:auto=自动轮播,clock=时钟,rainbow=彩虹,rain=数字雨,life=生命游戏,fire=火焰,drawing=画板,text=跑马灯,ball=小球 | 模式 | 自动轮播时按键换下一个，其它选项固定显示一种
text_speed = number:30-500 | 跑马灯速度（毫秒） | 每移动一列的时间，越小越快
tilt = number:0-7 | 小球方向 | 传感器相对矩阵的方向：0 到 3 为顺时针转 0、90、180、270 度，加 4 为左右镜像
color_clock = text | 时钟颜色 | 六位十六进制 RRGGBB，留空为彩色
color_rainbow = text | 彩虹颜色 | 留空为彩虹，填一个颜色则是这个颜色的明暗波浪
color_rain = text | 数字雨颜色 | 留空为绿色
color_life = text | 生命游戏颜色 | 留空为按年龄变色
color_fire = text | 火焰颜色 | 留空为红黄色
color_text = text | 跑马灯颜色 | 留空为彩色
color_ball = text | 小球颜色 | 留空为彩色

[config]
brightness = 25 ; LED brightness in percent of the firmware's limit
mode = auto ; auto: the pages turn; a page id: that one stays
text_speed = 100 ; the marquee: ms a column
tilt = 3 ; the ball: quarter turns of the sensor against the matrix (0..3), +4 mirrored
color_clock = ; rrggbb, empty: the effect's own colours
color_rainbow =
color_rain =
color_life =
color_fire =
color_text =
color_ball =
