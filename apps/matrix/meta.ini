[app]
pages = 6
page_ids = clock, rainbow, rain, life, fire, drawing ; English page names: <app>.<id> in a combined app (front: the first)
page_names = 时钟, 彩虹, 数字雨, 生命游戏, 火焰, 画板 ; the pages' own names, as page_ids (the settings page shows them)
id = matrix
name = 矩阵灯
description = 8×8 彩色 LED 矩阵上的五种效果（滚动时钟、彩虹、数字雨、生命游戏、火焰）和一块画板，按键切换或自动轮播；画板在设备网页的应用选项卡里用鼠标或手指画；需要带 LED 矩阵的板子（ESP32-S3-Matrix），其它板子只在屏幕上显示预览；不需要联网
version = 1
applib = 1.1 ; the app library version it needs (apps/lib/, MAJOR.MINOR: the same MAJOR, an equal or higher MINOR)

[fields]
; how the settings page shows each [config] key: type | label | help
; types: text, number:min-max, bool, select:value=label,value=label
; (no ASCII ; or # in these lines: they start a comment)
brightness = number:1-100 | 亮度 | LED 的亮度百分比，100 是固件允许的上限（防止发热）

[config]
brightness = 25 ; LED brightness in percent of the firmware's limit
