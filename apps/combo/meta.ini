[app]
id = combo
name = 合集
description = 把几个应用的页面合成一个轮播：天气、万年历、最新消息、股票等，每页标出所属应用和序号；中长按进入该应用本身，在那里中长按回来
version = 1
pages = 5

[combo]
; the apps whose code this app carries (their settings below get the app's prefix: weather.location)
members = weather, calendar, wxpusher, stocks

[fields]
entries = text | 显示的页面 | 逗号分开，按顺序轮播。应用.页（1 起的序号、页名或 front），或应用提供的视图，如 wxpusher.news[0]（最新一条消息）
carousel = select:=跟随系统,1=自动轮播,0=手动翻页 | 自动轮播 | 留空跟随 config.ini
carousel_seconds = text | 每页秒数 | 一个数，或每页一个：15,10,10

[config]
entries = weather.1, weather.2, calendar.1, wxpusher.news[0], stocks.1 ; app.page or a view, comma separated
carousel = 1 ; 1: turn the pages by themselves
carousel_seconds = 10 ; seconds per page, or one per page
